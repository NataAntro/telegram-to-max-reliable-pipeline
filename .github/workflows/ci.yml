name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://pipeline:pipeline@127.0.0.1:5432/pipeline
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: pipeline
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: bandit -q -r src
      - run: pip-audit -r requirements-runtime.lock
      - run: pytest
      - run: python -m reliable_pipeline
      - run: docker build -t telegram-max-reliability:test .
