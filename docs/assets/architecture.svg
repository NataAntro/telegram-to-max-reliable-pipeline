<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура конвейера импорта</title>
  <desc id="desc">API создаёт идемпотентную задачу, пул источников получает данные, машина состояний сохраняет прогресс, пул назначения публикует результат.</desc>
  <rect width="1200" height="520" rx="28" fill="#f4f8fb"/>
  <text x="60" y="70" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#123047">Конвейер импорта</text>
  <g font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">
    <rect x="55" y="145" width="180" height="90" rx="16" fill="#ffffff" stroke="#258a8a" stroke-width="3"/>
    <text x="145" y="182" fill="#123047">FastAPI</text><text x="145" y="212" fill="#496779" font-size="16">Idempotency-Key</text>
    <rect x="285" y="145" width="190" height="90" rx="16" fill="#e8f6f4" stroke="#258a8a" stroke-width="3"/>
    <text x="380" y="182" fill="#123047">Пул источников</text><text x="380" y="212" fill="#496779" font-size="16">тайм-аут · резерв</text>
    <rect x="505" y="120" width="250" height="140" rx="16" fill="#123047"/>
    <text x="630" y="168" fill="#ffffff">Машина состояний</text><text x="630" y="200" fill="#bfe6df" font-size="16">прогресс · восстановление</text><text x="630" y="228" fill="#bfe6df" font-size="16">needs_attention</text>
    <rect x="785" y="145" width="190" height="90" rx="16" fill="#e8f6f4" stroke="#258a8a" stroke-width="3"/>
    <text x="880" y="182" fill="#123047">Пул назначения</text><text x="880" y="212" fill="#496779" font-size="16">повтор · пауза</text>
    <rect x="1025" y="145" width="130" height="90" rx="16" fill="#ffffff" stroke="#258a8a" stroke-width="3"/>
    <text x="1090" y="182" fill="#123047">Результат</text><text x="1090" y="212" fill="#496779" font-size="16">durable token</text>
  </g>
  <g stroke="#258a8a" stroke-width="4" fill="none">
    <path d="M235 190 H275"/><path d="M265 180 L275 190 L265 200"/>
    <path d="M475 190 H495"/><path d="M485 180 L495 190 L485 200"/>
    <path d="M755 190 H775"/><path d="M765 180 L775 190 L765 200"/>
    <path d="M975 190 H1015"/><path d="M1005 180 L1015 190 L1005 200"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18">
    <rect x="285" y="330" width="690" height="115" rx="18" fill="#ffffff" stroke="#bed2dc" stroke-width="2"/>
    <text x="320" y="372" font-weight="700" fill="#123047">Состояние ресурсов</text>
    <text x="320" y="407" fill="#496779">ready · busy · cooldown · failures · load</text>
    <path d="M630 260 V320" stroke="#bed2dc" stroke-width="3" stroke-dasharray="8 8"/>
  </g>
</svg>
